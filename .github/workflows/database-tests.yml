name: Database tests

on:
  push:
    paths:
      - "database/**"
      - ".github/workflows/database-tests.yml"
  pull_request:
    paths:
      - "database/**"
      - ".github/workflows/database-tests.yml"
  workflow_dispatch:

jobs:
  meridian-oms-suite:
    name: Meridian OMS MySQL suite (10 cases)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Run 10-case database suite
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PWD: root
        run: bash database/run_suite.sh
